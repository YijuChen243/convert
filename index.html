<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 辦公全能助理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #f1f5f9; 
            font-size: 16px; /* 提高基礎字級 */
        }
        /* 針對電腦版優化文字大小 */
        .excel-input { 
            font-family: 'Courier New', Courier, monospace; 
            scrollbar-width: thin;
            font-size: 1.1rem !important; /* 放大輸入區文字 */
            line-height: 1.6;
        }
        
        .theme-postal { --main: #059669; --grad: linear-gradient(135deg, #059669 0%, #10b981 100%); --light: #ecfdf5; }
        .theme-name { --main: #2563eb; --grad: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%); --light: #eff6ff; }
        .theme-date { --main: #d97706; --grad: linear-gradient(135deg, #d97706 0%, #f59e0b 100%); --light: #fffbeb; }
        .theme-miguo { --main: #4f46e5; --grad: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); --light: #eef2ff; }
        .theme-clean { --main: #7c3aed; --grad: linear-gradient(135deg, #7c3aed 0%, #a78bfa 100%); --light: #f5f3ff; }

        .active-tab { 
            border-bottom: 5px solid var(--main); 
            color: var(--main); 
            background-color: #fff;
            transform: translateY(-2px);
        }
        .dynamic-bg { background: var(--grad); }
        .dynamic-text { color: var(--main); }
        
        /* 讓表格行高更舒適 */
        #outputTable td {
            padding-top: 1.25rem;
            padding-bottom: 1.25rem;
            vertical-align: middle;
        }

        /* 隱藏滾動條但保留功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes pulse-custom { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .loading-pulse { animation: pulse-custom 1.5s infinite; }
    </style>
</head>
<body class="min-h-screen pb-10 theme-postal" id="bodyNode">
    <nav id="navBar" class="dynamic-bg text-white py-4 px-6 shadow-xl mb-8 transition-all duration-500">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="bg-white/20 p-3 rounded-xl shadow-inner"><i id="navIcon" class="fas fa-rocket text-2xl"></i></div>
                <div>
                    <h1 class="text-2xl font-black tracking-tight">AI 辦公全能助理 <span class="text-sm font-normal opacity-70 ml-2">旗艦增強版</span></h1>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="hidden md:block text-sm font-bold bg-black/20 px-4 py-2 rounded-full border border-white/20 backdrop-blur-sm">
                    <i class="far fa-clock mr-2"></i>基準日：西元 <span id="currentDateDisplay"></span>
                </div>
                <div class="flex items-center gap-2 bg-black/20 px-3 py-2 rounded-full border border-white/20">
                    <i class="fas fa-key text-sm opacity-70"></i>
                    <input id="apiKeyInput" type="password" placeholder="貼上 Claude API Key" 
                        class="bg-transparent text-white text-sm font-mono w-48 outline-none placeholder-white/40"
                        oninput="saveApiKey(this.value)">
                    <button onclick="toggleApiKeyVisibility()" class="opacity-60 hover:opacity-100 transition">
                        <i id="eyeIcon" class="fas fa-eye-slash text-sm"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 分頁導航 - 放大字體與高度 -->
    <div class="max-w-7xl mx-auto px-4 mb-8">
        <div class="flex bg-white rounded-2xl shadow-md overflow-x-auto no-scrollbar border border-slate-200">
            <button onclick="switchTab('postal')" id="tabPostal" class="flex-1 min-w-[120px] py-6 font-bold text-center active-tab transition-all">
                <i class="fas fa-mail-bulk mb-2 text-xl block"></i><span class="text-sm sm:text-base">郵遞區號</span>
            </button>
            <button onclick="switchTab('name')" id="tabName" class="flex-1 min-w-[120px] py-6 font-bold text-center text-slate-400 transition-all">
                <i class="fas fa-id-badge mb-2 text-xl block"></i><span class="text-sm sm:text-base">姓名英譯</span>
            </button>
            <button onclick="switchTab('date')" id="tabDate" class="flex-1 min-w-[120px] py-6 font-bold text-center text-slate-400 transition-all">
                <i class="fas fa-calendar-alt mb-2 text-xl block"></i><span class="text-sm sm:text-base">生日計算</span>
            </button>
            <button onclick="switchTab('miguo')" id="tabMiguo" class="flex-1 min-w-[120px] py-6 font-bold text-center text-slate-400 transition-all">
                <i class="fas fa-exchange-alt mb-2 text-xl block"></i><span class="text-sm sm:text-base">西元轉民國</span>
            </button>
            <button onclick="switchTab('clean')" id="tabClean" class="flex-1 min-w-[120px] py-6 font-bold text-center text-slate-400 transition-all">
                <i class="fas fa-broom mb-2 text-xl block"></i><span class="text-sm sm:text-base">文字清洗</span>
            </button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- 左輸入 - 優化標題與提示 -->
            <div class="lg:col-span-4">
                <div class="bg-white rounded-3xl shadow-xl p-6 border border-slate-100">
                    <div class="flex items-center gap-3 mb-4">
                        <i id="inputIcon" class="fas fa-edit text-xl dynamic-text"></i> 
                        <h3 class="text-xl font-bold text-slate-800" id="inputTitle">批次資料貼上區</h3>
                    </div>
                    
                    <div id="hintBox" class="text-sm p-4 rounded-xl mb-5 leading-relaxed font-medium transition-all shadow-inner"></div>
                    
                    <textarea id="mainInput" rows="15" 
                        class="excel-input w-full rounded-2xl border-slate-200 shadow-inner focus:ring-4 focus:ring-opacity-20 p-5 bg-slate-50 focus:outline-none mb-5 transition-all" 
                        placeholder="請從 Excel 直接複製一整欄資料，然後貼到這裡..."></textarea>
                    
                    <button id="btnProcess" onclick="executeProcess()" 
                        class="w-full dynamic-bg hover:brightness-110 active:scale-95 text-white font-black py-5 rounded-2xl transition shadow-xl flex justify-center items-center gap-3 text-xl tracking-widest">
                        <i class="fas fa-bolt text-2xl"></i> 開始 AI 處理
                    </button>
                    
                    <button onclick="clearAll()" class="w-full mt-4 text-slate-400 text-sm font-bold py-2 hover:text-slate-600 transition">
                        <i class="fas fa-trash-alt mr-2"></i>清空所有內容
                    </button>
                </div>
            </div>

            <!-- 右輸出 - 優化表格與結果字級 -->
            <div class="lg:col-span-8">
                <div class="bg-white rounded-3xl shadow-xl p-6 min-h-[600px] border border-slate-100 relative overflow-hidden">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
                        <div class="flex items-center gap-3">
                            <div class="w-2 h-8 dynamic-bg rounded-full"></div>
                            <h3 class="text-xl font-bold text-slate-800">AI 辨識結果表單</h3>
                        </div>
                        <div id="actionButtons" class="hidden flex gap-3 w-full sm:w-auto">
                            <button onclick="copyToClipboard()" class="flex-1 sm:flex-none text-sm font-bold bg-white text-slate-600 hover:bg-slate-50 px-5 py-3 rounded-xl border-2 border-slate-100 flex items-center justify-center gap-2 transition active:bg-slate-100">
                                <i class="fas fa-copy"></i> 複製表格
                            </button>
                            <button onclick="exportCSV()" class="flex-1 sm:flex-none text-sm font-bold bg-slate-900 text-white hover:bg-black px-5 py-3 rounded-xl flex items-center justify-center gap-2 transition shadow-lg active:scale-95">
                                <i class="fas fa-download"></i> 匯出 CSV
                            </button>
                        </div>
                    </div>

                    <div id="placeholderText" class="flex flex-col items-center justify-center py-40 text-slate-300">
                        <div class="bg-slate-50 p-10 rounded-full mb-6 shadow-inner"><i class="fas fa-table text-7xl opacity-20"></i></div>
                        <p class="text-lg font-bold text-slate-400 tracking-wide">目前沒有資料，請在左側貼上資料後執行</p>
                        <p class="text-sm mt-2 opacity-60">AI 會自動幫您分析與格式化內容</p>
                    </div>

                    <div id="tableWrapper" class="hidden overflow-x-auto rounded-xl">
                        <table class="w-full text-left" id="outputTable">
                            <thead id="tableHead" class="bg-slate-50"></thead>
                            <tbody id="tableBody" class="text-slate-700"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 訊息提示 - 放大 -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-900/95 backdrop-blur-xl text-white px-10 py-4 rounded-2xl shadow-2xl opacity-0 transition-all pointer-events-none z-50 text-base font-black border border-white/10 tracking-widest"></div>
   <script src="config.js"></script>
    <script>
        // API Key 管理（存在 sessionStorage，關閉瀏覽器就清除）
        function getApiKey() {
            return document.getElementById('apiKeyInput').value.trim() || sessionStorage.getItem('claudeApiKey') || '';
        }
        function saveApiKey(val) {
            if (val) sessionStorage.setItem('claudeApiKey', val);
        }
        function toggleApiKeyVisibility() {
            const inp = document.getElementById('apiKeyInput');
            const icon = document.getElementById('eyeIcon');
            if (inp.type === 'password') {
                inp.type = 'text';
                icon.className = 'fas fa-eye text-sm';
            } else {
                inp.type = 'password';
                icon.className = 'fas fa-eye-slash text-sm';
            }
        }
        let currentTab = 'postal';
        const today = new Date();
        document.getElementById('currentDateDisplay').innerText = `${today.getFullYear()} / ${today.getMonth()+1} / ${today.getDate()}`;

        const tabConfig = {
            postal: { icon: 'fa-map-marker-alt', title: '地址批次處理', hint: '貼上地址（如： 台東市正氣路440號），AI 將自動辨識 3+3 郵遞區號。', theme: 'theme-postal', btnIcon: 'fa-mail-bulk' },
            name: { icon: 'fa-signature', title: '姓名英譯處理', hint: '貼上中文姓名，AI 將自動轉換護照規格（漢語、威妥瑪）拼音。', theme: 'theme-name', btnIcon: 'fa-id-badge' },
            date: { icon: 'fa-calendar-check', title: '民國生日換算', hint: '貼上民國年日期（如：800520），計算西元、足歲與十二生肖。', theme: 'theme-date', btnIcon: 'fa-birthday-cake' },
            miguo: { icon: 'fa-calendar-alt', title: '西元轉民國 (EMMDD)', hint: '將西元日期轉換為 7 碼民國格式。年份補齊三碼（如：2026 轉 115）。', theme: 'theme-miguo', btnIcon: 'fa-exchange-alt' },
            clean: { icon: 'fa-broom', title: '資料清洗與萃取', hint: '格式化手機號碼、半形化文字、提取 Email 或關鍵字。', theme: 'theme-clean', btnIcon: 'fa-wand-sparkles' }
        };

        function switchTab(tab) {
            currentTab = tab;
            const config = tabConfig[tab];
            const body = document.getElementById('bodyNode');
            const navIcon = document.getElementById('navIcon');
            const inputIcon = document.getElementById('inputIcon');
            const inputTitle = document.getElementById('inputTitle');
            const hintBox = document.getElementById('hintBox');

            Object.values(tabConfig).forEach(c => body.classList.remove(c.theme));
            body.classList.add(config.theme);

            document.querySelectorAll('nav + div button').forEach(btn => {
                btn.classList.remove('active-tab');
                btn.classList.add('text-slate-400');
            });
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active-tab');
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove('text-slate-400');

            navIcon.className = `fas ${config.btnIcon} text-2xl`;
            inputIcon.className = `fas ${config.icon} text-2xl dynamic-text`;
            inputTitle.innerText = config.title;
            hintBox.className = `text-sm p-4 rounded-xl mb-5 leading-relaxed font-bold transition-all shadow-sm ${tab === 'clean' ? 'bg-purple-50 text-purple-700' : (tab === 'postal' ? 'bg-emerald-50 text-emerald-700' : (tab === 'date' ? 'bg-amber-50 text-amber-700' : (tab === 'name' ? 'bg-blue-50 text-blue-700' : 'bg-indigo-50 text-indigo-700')))}`;
            hintBox.innerText = config.hint;

            clearAll();
        }

        async function queryZip(address) {
            try {
                const url = `https://zip5.5432.tw/zip5json.py?adrs=${encodeURIComponent(address)}`;
                const res = await fetch(url);
                const data = await res.json();
                const zip6 = data.zipcode6 || "";
                // 若查到合法6碼且非原地址回傳（代表有查到）
                if (/^[0-9]{6}$/.test(zip6)) return zip6;
            } catch(e) {}
            return null; // 回傳 null 代表需要 AI 補查
        }

        async function queryZipWithAI(address, apiKey) {
            const res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': apiKey,
                    'anthropic-version': '2023-06-01',
                    'anthropic-dangerous-direct-browser-access': 'true'
                },
                body: JSON.stringify({
                    model: "claude-sonnet-4-5",
                    max_tokens: 200,
                    system: `你是台灣中華郵政3+3郵遞區號專家。已知重要參考資料：
蘭嶼鄉朗島（全）→952002，朗島國小→952304
蘭嶼鄉紅頭→952901，野銀→952101，椰油→952201，漁人→952401，東清→952501
綠島鄉→951xxx，延平鄉→958xxx，卑南鄉→954xxx
只能回傳6位數字郵遞區號，不得有任何其他文字。`,
                    messages: [{ role: "user", content: `地址：${address}
請查出此地址的中華郵政3+3六碼郵遞區號，只回傳6位數字。` }]
                })
            });
            const data = await res.json();
            const zip = (data.content[0].text || "").trim().replace(/[^0-9]/g, "").slice(0, 6);
            return /^[0-9]{6}$/.test(zip) ? zip : "查無結果";
        }

                async function executeProcess() {
            const apiKey = getApiKey();
            const rawText = document.getElementById('mainInput').value.trim();
            if (!rawText) { showToast("請先貼上資料！"); return; }
            // 郵遞區號 tab 不一定需要 key（有 AI 補查才需要）
            if (currentTab !== 'postal' && !apiKey) {
                showToast("⚠️ 請先在右上角輸入您的 Claude API Key！");
                document.getElementById('apiKeyInput').focus();
                return;
            }

            const lines = rawText.split('\n').filter(l => l.trim() !== "");
            const tableBody = document.getElementById('tableBody');
            const tableHead = document.getElementById('tableHead');
            const placeholder = document.getElementById('placeholderText');
            const wrapper = document.getElementById('tableWrapper');
            const btn = document.getElementById('btnProcess');

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch animate-spin text-2xl"></i> AI 正在分析中...`;
            placeholder.classList.add('hidden');
            wrapper.classList.remove('hidden');

            const headers = {
                postal: ['原始地址資料', '3+3 郵遞區號', '匹配狀態'],
                name: ['中文姓名', '漢語拼音 (護照)', '威妥瑪拼音'],
                date: ['輸入日期', '西元生日 (YYYY/MM/DD)', '足歲 / 生肖'],
                miguo: ['輸入西元日期', '民國格式 (EMMDD)', '轉換詳情'],
                clean: ['原始文字內容', '清洗後結果', '執行動作']
            }[currentTab];

            tableHead.innerHTML = `<tr>${headers.map(h => `<th class="p-5 text-slate-500 text-xs font-black uppercase tracking-widest border-b-2 border-slate-100">${h}</th>`).join('')}</tr>`;
            tableBody.innerHTML = lines.map(line => `<tr class="loading-pulse"><td class="p-6 border-b border-slate-50 text-sm text-slate-300 font-medium">${line}</td><td class="p-6 border-b border-slate-50 text-center font-bold">---</td><td class="p-6 border-b border-slate-50 text-xs text-slate-300">處理中...</td></tr>`).join('');

            try {
                let systemPrompt = `你是一個專業辦公室資料處理專家。請將輸入的所有資料一次批次處理完畢，不可遺漏任何一筆，並僅回傳純 JSON Array（不含 markdown、不含說明文字）。目前的西元日期是 ${today.getFullYear()}/${today.getMonth()+1}/${today.getDate()}。`;
                let userPrompt = "";

                if (currentTab === 'postal') {
                    // 直接使用 zip5.5432.tw API（基於中華郵政官方資料，免驗證碼）
                    const postalHeaders = ['原始地址資料', '3+3 郵遞區號', '匹配狀態'];
                    tableHead.innerHTML = `<tr>${postalHeaders.map(h => `<th class="p-5 text-slate-500 text-xs font-black uppercase tracking-widest border-b-2 border-slate-100">${h}</th>`).join('')}</tr>`;
                    tableBody.innerHTML = lines.map(line => `<tr class="loading-pulse"><td class="p-6 border-b border-slate-50 text-sm text-slate-300 font-medium">${line}</td><td class="p-6 border-b border-slate-50 text-center font-bold">---</td><td class="p-6 border-b border-slate-50 text-xs text-slate-300">查詢中...</td></tr>`).join('');
                    tableBody.innerHTML = '';
                    let doneCount = 0;
                    for (const line of lines) {
                        let zip = await queryZip(line);
                        let source = '中華郵政資料';
                        if (!zip) {
                            btn.innerHTML = `<i class="fas fa-circle-notch animate-spin text-2xl"></i> AI 補查中...`;
                            zip = await queryZipWithAI(line, apiKey);
                            source = 'AI 補查';
                        }
                        const is6 = /^[0-9]{6}$/.test(zip);
                        const row = document.createElement('tr');
                        row.className = "hover:bg-slate-50 transition border-b border-slate-50";
                        row.innerHTML = `
                            <td class="p-6 text-slate-800 text-base font-medium">${line}</td>
                            <td class="p-6 text-center">
                                <span class="${is6 ? 'bg-emerald-600' : 'bg-red-400'} text-white px-5 py-2.5 rounded-xl font-mono font-black shadow-md inline-block text-lg tracking-wider">${zip}</span>
                            </td>
                            <td class="p-6 text-slate-500 text-sm font-medium italic">${is6 ? '✅ ' + source : '⚠️ 查無結果'}</td>
                        `;
                        tableBody.appendChild(row);
                        doneCount++;
                        btn.innerHTML = `<i class="fas fa-circle-notch animate-spin text-2xl"></i> 已完成 ${doneCount}/${lines.length}`;
                        await new Promise(r => setTimeout(r, 600));
                    }
                    document.getElementById('actionButtons').classList.remove('hidden');
                    showToast("✅ 郵遞區號查詢完成！");
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fas fa-bolt text-2xl"></i> 開始 AI 處理`;
                    return;
                } else if (currentTab === 'name') {
                    userPrompt = `中翻英。姓在前、全大寫、名在後。回傳：[{"original":"姓名","result":"漢語","extra":"威妥瑪"}]\n資料：\n${lines.join('\n')}`;
                } else if (currentTab === 'date') {
                    userPrompt = `民國生日算西元與足歲。格式：[{"original":"日期","result":"YYYY/MM/DD","extra":"XX歲 / 生肖"}]\n資料：\n${lines.join('\n')}`;
                } else if (currentTab === 'miguo') {
                    userPrompt = `西元轉民國EMMDD。民國年E必須三碼。回傳：[{"original":"西元","result":"EMMDD","extra":"說明"}]\n資料：\n${lines.join('\n')}`;
                } else {
                    userPrompt = `清洗資料：統一半形、手機格式化(09XXXXXXXX)、提取Email或關鍵字。回傳：[{"original":"原文","result":"結果","extra":"動作"}]\n資料：\n${lines.join('\n')}`;
                }

                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01',
                        'anthropic-dangerous-direct-browser-access': 'true'
                    },
                    body: JSON.stringify({
                        model: "claude-sonnet-4-20250514",
                        max_tokens: 8000,
                        system: systemPrompt,
                        messages: [{ role: "user", content: userPrompt + "\n\n【重要】請一次回傳所有筆資料的結果，不可省略任何一筆。只回傳純 JSON Array，不要任何說明文字、前言或 markdown 符號。" }]
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                const rawText = data.content[0].text.trim().replace(/^```json|^```|```$/gm, '').trim();
                const aiResults = JSON.parse(rawText);
                
                tableBody.innerHTML = '';
                const badgeClass = {
                    postal: 'bg-emerald-600', name: 'bg-blue-600', date: 'bg-amber-600', miguo: 'bg-indigo-600', clean: 'bg-purple-600'
                }[currentTab];

                aiResults.forEach(item => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-slate-50 transition border-b border-slate-50";
                    row.innerHTML = `
                        <td class="p-6 text-slate-800 text-base font-medium">${item.original}</td>
                        <td class="p-6 text-center">
                            <span class="${badgeClass} text-white px-5 py-2.5 rounded-xl font-mono font-black shadow-md inline-block text-lg tracking-wider">
                                ${item.result}
                            </span>
                        </td>
                        <td class="p-6 text-slate-500 text-sm font-medium italic leading-relaxed">${item.extra}</td>
                    `;
                    tableBody.appendChild(row);
                });

                document.getElementById('actionButtons').classList.remove('hidden');
                showToast("✅ AI 處理完成！");
            } catch (error) {
                console.error(error);
                showToast("❌ 處理發生錯誤，請重試");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-bolt text-2xl"></i> 開始 AI 處理`;
            }
        }

        function clearAll() {
            document.getElementById('mainInput').value = '';
            document.getElementById('tableWrapper').classList.add('hidden');
            document.getElementById('placeholderText').classList.remove('hidden');
            document.getElementById('actionButtons').classList.add('hidden');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 3000);
        }

        function copyToClipboard() {
            const table = document.getElementById('outputTable');
            let text = "";
            table.querySelectorAll('tr').forEach(tr => {
                const row = Array.from(tr.querySelectorAll('th, td')).map(td => td.innerText.trim());
                text += row.join('\t') + '\n';
            });
            const el = document.createElement('textarea'); el.value = text;
            document.body.appendChild(el); el.select(); document.execCommand('copy');
            document.body.removeChild(el); showToast("📋 表格已複製，可直接貼上 Excel");
        }

        function exportCSV() {
            const table = document.getElementById('outputTable');
            let csv = "\uFEFF";
            table.querySelectorAll('tr').forEach(tr => {
                const row = Array.from(tr.querySelectorAll('th, td')).map(c => `"${c.innerText.trim().replace(/"/g, '""')}"`);
                csv += row.join(',') + "\r\n";
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url; link.download = `AI_助手數據_${new Date().getTime()}.csv`;
            link.click();
        }

        window.onload = () => {
            switchTab('postal');
            // 從 sessionStorage 恢復上次輸入的 Key
            const saved = sessionStorage.getItem('claudeApiKey');
            if (saved) document.getElementById('apiKeyInput').value = saved;
        };
    </script>
</body>
</html>
